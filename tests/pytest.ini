[pytest]
minversion = 7.0
addopts = -v --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    cleat_angle: Tests for Cleat Angle Connection
    fin_plate: Tests for Fin Plate Connection
    tension_welded: Tests for Tension Member Welded
    designation: Tests checking designation values
    bolt_configuration: Tests checking bolt rows and columns
